<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bankrot nebo Plná Kasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #1a1c2c; color: #f4f4f4;
    font-family: "Press Start 2P", "Courier New", monospace;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    overscroll-behavior: none;
  }
  #app {
    height: 100%; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 8px;
  }
  /* Desktop: portrait 400x800 window, max 800px tall, centred */
  #wrap { position: relative; height: min(800px, 100%); aspect-ratio: 1 / 2; max-width: 100%; flex: none; }
  canvas {
    display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges;
    border: 4px solid #f4f4f4; box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #000; background: #000;
  }
  .overlay {
    position: absolute; inset: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; background: rgba(16, 18, 32, .55); padding: 16px; overflow-y: auto;
  }
  .overlay.dark { background: rgba(16, 18, 32, .9); justify-content: flex-start; }
  .hidden { display: none !important; }
  h1 { font-size: clamp(18px, 6vw, 30px); line-height: 1.45; color: #ffcd75; text-shadow: 3px 3px 0 #b13e53, 6px 6px 0 #000; }
  h1 .b { color: #ff5a5a; text-shadow: 3px 3px 0 #5a1010, 6px 6px 0 #000; }
  h1 .k { color: #4a9eff; text-shadow: 3px 3px 0 #29366f, 6px 6px 0 #000; }
  h2 { font-size: clamp(16px, 5vw, 26px); color: #ef7d57; text-shadow: 3px 3px 0 #000; }
  h3 { font-size: 11px; margin: 14px 0 8px; text-shadow: 2px 2px 0 #000; }
  p { font-size: clamp(9px, 2.6vw, 12px); line-height: 1.9; color: #f4f4f4; text-shadow: 2px 2px 0 #000; }
  .small { font-size: 8px; color: #b0b8d0; }
  .gold { color: #ffcd75; }
  .btn {
    font-family: inherit; font-size: clamp(12px, 3.6vw, 16px); color: #1a1c2c; background: #f4f4f4;
    border: 4px solid #000; padding: 14px 18px; cursor: pointer; min-width: 220px;
    box-shadow: inset -4px -4px 0 #9aa0ad, 4px 4px 0 #000;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: inset -4px -4px 0 #9aa0ad; }
  .btn.green { background: #a7f070; box-shadow: inset -4px -4px 0 #38b764, 4px 4px 0 #000; font-size: clamp(16px, 5vw, 22px); padding: 18px 24px; }
  .btn.green:active { box-shadow: inset -4px -4px 0 #38b764; }
  .btn.blue { background: #73c2ff; box-shadow: inset -4px -4px 0 #3b5dc9, 4px 4px 0 #000; }
  .btn.blue:active { box-shadow: inset -4px -4px 0 #3b5dc9; }
  .btn.sm { min-width: 0; font-size: 10px; padding: 10px 12px; }
  .menuBtns { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  #grid { display: flex; flex-direction: column; width: 100%; max-width: 360px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .slot { aspect-ratio: 1; border: 3px solid #333c57; background: #0e0f1a; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .slot canvas { width: 70%; height: 70%; border: 0; box-shadow: none; background: transparent; }
  #info { min-height: 44px; font-size: 9px; line-height: 1.8; }
  .setRow { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #controls { display: none; width: 100%; gap: 10px; flex: none; }
  .ctrl {
    flex: 1; height: 88px; min-height: 80px; font-family: inherit; font-size: 40px; color: #fff;
    border: 4px solid #000; touch-action: none; cursor: pointer; text-shadow: 3px 3px 0 #000;
  }
  #btnDuck { background: #e04040; box-shadow: inset -6px -6px 0 #8a1c1c, 5px 5px 0 #000; }
  #btnJump { background: #38b764; box-shadow: inset -6px -6px 0 #1e6b3a, 5px 5px 0 #000; }
  .ctrl.on { transform: translate(4px, 4px); filter: brightness(1.25); }
  #btnDuck.on { box-shadow: inset -6px -6px 0 #8a1c1c, 1px 1px 0 #000; }
  #btnJump.on { box-shadow: inset -6px -6px 0 #1e6b3a, 1px 1px 0 #000; }
  #rotate {
    position: fixed; inset: 0; z-index: 10; background: #1a1c2c; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; text-align: center;
  }
  #rotate .phone { width: 48px; height: 80px; border: 6px solid #f4f4f4; border-radius: 6px; animation: rot 1.6s steps(4) infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(90deg); } 70%, 100% { transform: rotate(0); } }
  /* Touch devices: full-width game (~90% height) + big buttons */
  @media (pointer: coarse) {
    #app { padding: 0 0 8px; gap: 6px; justify-content: flex-start; }
    #wrap { width: 100%; height: auto; aspect-ratio: auto; flex: 1 1 auto; max-height: 90dvh; min-height: 0; }
    canvas { border-width: 3px; box-shadow: none; }
    .overlay { inset: 3px; }
    #controls { display: flex; padding: 0 8px; }
  }
  @media (pointer: coarse) and (orientation: landscape) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="game" width="400" height="800"></canvas>

    <div id="menu" class="overlay">
      <h1><span class="b">BANKROT</span><br>NEBO<br><span class="k">PLNÁ KASA</span></h1>
      <div class="menuBtns">
        <button class="btn green" id="playBtn">▶ HRÁT</button>
        <button class="btn blue" id="collBtn">SBÍRKA</button>
        <button class="btn" id="setBtn">NASTAVENÍ</button>
      </div>
      <p>Nejlepší skóre:<br><span class="gold" id="bestMenu">0</span> tokenů</p>
      <p class="small" id="collCount"></p>
      <p class="small">Mezerník / ↑ = skok · ↓ = dřep</p>
    </div>

    <div id="coll" class="overlay dark hidden">
      <h2>SBÍRKA</h2>
      <p class="small" id="collCount2"></p>
      <div id="grid"></div>
      <p id="info">Klepni na předmět</p>
      <button class="btn sm" id="collBack">◀ ZPĚT</button>
    </div>

    <div id="sett" class="overlay dark hidden">
      <h2>NASTAVENÍ</h2>
      <div class="setRow"><p>Zvuk</p><button class="btn" id="sndBtn">ZAP</button></div>
      <div class="setRow"><p>Obtížnost</p><button class="btn" id="diffBtn">NORMÁLNÍ</button></div>
      <p class="small" id="diffInfo"></p>
      <button class="btn sm" id="setBack">◀ ZPĚT</button>
    </div>

    <div id="over" class="overlay hidden">
      <h2>BANKROT!</h2>
      <p>Skóre: <span class="gold" id="scoreOver">0</span> tokenů</p>
      <p id="newBest" class="gold hidden">★ NOVÝ REKORD ★</p>
      <p>Nejlepší: <span class="gold" id="bestOver">0</span></p>
      <p class="small" id="runInfo"></p>
      <div class="menuBtns">
        <button class="btn green" id="againBtn">ZNOVU</button>
        <button class="btn" id="menuBtn">MENU</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl" id="btnDuck" aria-label="Dřep">↓</button>
    <button class="ctrl" id="btnJump" aria-label="Skok">↑</button>
  </div>
</div>

<div id="rotate">
  <div class="phone"></div>
  <p>Otoč telefon<br>na výšku</p>
</div>

<script>
(() => {
  'use strict';

  // ================= Setup =================
  const H = 800, GY = 600, PX = 60, LW = 512;
  let W = 400;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const FONT = '"Press Start 2P", monospace';

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  let best = store.get('bnpk_best', 0) | 0;
  let found = store.get('bnpk_coll', {}) || {};
  const settings = Object.assign({ sound: true, diff: 1 }, store.get('bnpk_set', {}));
  const DIFFS = [
    { name: 'LEHKÁ', mul: 0.82, lives: 5, info: '5 životů, pomalejší' },
    { name: 'NORMÁLNÍ', mul: 1, lives: 3, info: '3 životy' },
    { name: 'TĚŽKÁ', mul: 1.22, lives: 1, info: '1 život, rychlejší' },
  ];

  function resize() {
    const r = $('wrap').getBoundingClientRect();
    const b = parseFloat(getComputedStyle(cv).borderLeftWidth) || 0;
    const w = r.width - b * 2, h = r.height - b * 2;
    if (w > 0 && h > 0) W = Math.max(320, Math.min(900, Math.round(H * w / h)));
    cv.width = W; cv.height = H;
    ctx.imageSmoothingEnabled = false;
  }

  // ================= Pixel helpers =================
  function canvasOf(w, h, fn) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); fn && fn(g, w, h); return c;
  }
  function makeSprite(rows, pal, scale = 2) {
    return canvasOf(rows[0].length * scale, rows.length * scale, g => {
      rows.forEach((r, y) => [...r].forEach((ch, x) => {
        if (ch === '.' || !pal[ch]) return;
        g.fillStyle = pal[ch]; g.fillRect(x * scale, y * scale, scale, scale);
      }));
    });
  }
  const R = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  function disc(g, cx, cy, r, c, s = 2) {
    g.fillStyle = c;
    for (let y = -r; y <= r; y += s) for (let x = -r; x <= r; x += s)
      if (x * x + y * y <= r * r) g.fillRect(Math.round(cx + x), Math.round(cy + y), s, s);
  }
  function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  const snap = (v, s = 4) => Math.round(v / s) * s;
  function bands(g, w, h, cols) { const bh = Math.ceil(h / cols.length); cols.forEach((c, i) => R(g, 0, i * bh, w, bh, c)); }
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ================= Klód =================
  const KP = { k: '#000000', b: '#4A9EFF', d: '#2a6fcc', l: '#9fd0ff', w: '#ffffff', r: '#ff4d4d', y: '#ffcd75' };
  const klodBody = [
    '.......rr.......',
    '.......kk.......',
    '.......kk.......',
    '..kkkkkkkkkkkk..',
    '..kllbbbbbbbbk..',
    '..kbwwwbbwwwbk..',
    '..kbwkkbbwkkbk..',
    '..kbwkkbbwkkbk..',
    '..kbbbbbbbbbbk..',
    '..kbbkkkkkkbbk..',
    '..kdbbbbbbbbdk..',
    '..kkkkkkkkkkkk..',
    '...kbbyybbbbk...',
    '...kddddddddk...',
  ];
  const happyBody = klodBody.slice();
  happyBody[5] = '..kbbbbbbbbbbk..';
  happyBody[6] = '..kbkbkbbkbkbk..';
  happyBody[7] = '..kbbbbbbbbbbk..';
  happyBody[9] = '..kbkbbbbbbkbk..';
  happyBody[10] = '..kdbkkkkkkbdk..';
  const deadBody = klodBody.slice();
  deadBody[5] = '..kbkbkbbkbkbk..';
  deadBody[6] = '..kbbkbbbbkbbk..';
  deadBody[7] = '..kbkbkbbkbkbk..';
  const legsA = ['...kk.....kk....', '...kk...........'];
  const legsB = ['..........kk....', '...kk.....kk....'];
  const legsAir = ['...kk....kk.....', '..kk......kk....'];
  const klodRun1 = makeSprite([...klodBody, ...legsA], KP);
  const klodRun2 = makeSprite([...klodBody, ...legsB], KP);
  const klodJump = makeSprite([...klodBody, ...legsAir], KP);
  const klodHappy = makeSprite([...happyBody, ...legsAir], KP);
  const klodDead = makeSprite([...deadBody, ...legsAir], KP);
  const duckRows = [
    '...........rr.......',
    '..kkkkkkkkkkkkkkkk..',
    '..kllbbbbbbbbbbbbk..',
    '..kbbbbbbwwwbbwwwk..',
    '..kbbbbbbwkkbbwkkk..',
    '..kbbbbbbbbbbbbbbk..',
    '..kdbbyybbkkkkkbdk..',
    '..kkkkkkkkkkkkkkkk..',
  ];
  const klodDuck1 = makeSprite([...duckRows, '...kk........kk.....', '...kk...........kk..'], KP);
  const klodDuck2 = makeSprite([...duckRows, '.............kk.....', '...kk.......kk......'], KP);
  const heartSpr = makeSprite(['.rr.rr.', 'rwrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r: '#ff3b30', w: '#ffd0d0' }, 2);
  const heartEmpty = makeSprite(['.kk.kk.', 'k..k..k', 'k.....k', '.k...k.', '..k.k..', '...k...'], { k: '#5a5a6a' }, 2);

  // ================= Obstacle sprites =================
  const cursorRows = [
    'k...........',
    'kk..........',
    'khk.........',
    'khgk........',
    'khggk.......',
    'khgggk......',
    'khggrgk.....',
    'khgggggk....',
    'khggggggk...',
    'khgggggrgk..',
    'khgggggkkkk.',
    'khgkggk.....',
    'khk.kggk....',
    'kk..kgrk....',
    'k....kggk...',
    '.....kkkk...',
  ];
  const grogRows = [
    '.......kkk..............',
    '.....kkwwwkk.........kk.',
    '....kwwwwwwwkkkkkkkkkwk.',
    '...kwwwwwwwwwwwwwwwwwwk.',
    '..kwwwkkwwwkkwwwwwwwwwkk',
    '.kwwwwkkwwwkkwwwggwwwwwk',
    '.kwwwwwwwwwwwwwwggwwwwwk',
    '..kwwwwwwwwwwwwwwwwwwwkk',
    '...kwwwwwwwwwwwwwwwwwwk.',
    '....kwwwwwwwkkkkkkkkkwk.',
    '.....kkwwwkk.........kk.',
    '.......kkk..............',
  ];
  const ufoRows = [
    '........kkkkkkkk........',
    '......kkcccbbccckk......',
    '.....kccccbbcccccck.....',
    '...kkkkkkkkkkkkkkkkkk...',
    '.kkwwwwwwwwwwwwwwwwwwkk.',
    'kwwlwwwlwwwlwwwlwwwlwwwk',
    'kggggggggggggggggggggggk',
    '.kkggggggggggggggggggkk.',
    '...kkkkkkkkkkkkkkkkkk...',
    '......kk........kk......',
    '.....kk..........kk.....',
    '........................',
  ];
  const cloudRows = ['....wwww......', '..wwwwwwww....', '.wwwwwwwwwww..', 'wwwwwwwwwwwwww', '.wwwwwwwwwwww.'];
  const flameMaps = [['.ry.', 'rryy', 'rryy', '.ry.'], ['.rry..', 'rrryyy', 'rrryyy', '.rry..']];
  function glowSprite(spr, color) {
    return canvasOf(spr.width + 16, spr.height + 16, g => {
      g.shadowColor = color; g.shadowBlur = 10; g.drawImage(spr, 8, 8); g.shadowBlur = 0; g.drawImage(spr, 8, 8);
    });
  }

  // ================= Themes (5 backgrounds) =================
  function gear(g, cx, cy, r, col, dark) {
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      disc(g, cx + Math.cos(a) * r, cy + Math.sin(a) * r, 5, col);
    }
    disc(g, cx, cy, r, col); disc(g, cx, cy, r * 0.45, dark); disc(g, cx, cy, r * 0.2, col);
  }

  const THEMES = [
    { // ---- 1. City
      name: 'Město', icon: '🏙️',
      sky: ['#0d0f1e', '#141734', '#1d1d45', '#2a2456', '#3e2c68', '#5a3678'],
      skyFx(g) { const r = rng(11); for (let i = 0; i < 70; i++) R(g, snap(r() * LW, 2), snap(r() * 330, 2), 2, 2, r() < .7 ? '#8a8fb8' : '#ffffff'); disc(g, 400, 90, 16, '#e8e8f8'); disc(g, 406, 84, 12, '#1d1d45'); },
      far(g) {
        const r = rng(5); let x = 0;
        while (x < LW) {
          const bw = Math.min(snap(28 + r() * 44), LW - x), bh = snap(170 + r() * 250);
          R(g, x, GY - bh, bw, bh, r() < .5 ? '#262a36' : '#30343f');
          for (let wy = GY - bh + 10; wy < GY - 8; wy += 12) for (let wx = x + 5; wx < x + bw - 6; wx += 9)
            R(g, wx, wy, 4, 5, r() < .32 ? pick(['#ffe28a', '#7ff6ff', '#ff7ad9', '#ffe28a']) : '#1a1d26');
          if (r() < .35) { R(g, x + bw / 2 - 1, GY - bh - 20, 2, 20, '#555a66'); R(g, x + bw / 2 - 2, GY - bh - 22, 4, 3, '#ff3b30'); }
          if (r() < .4) R(g, x, GY - bh, bw, 3, pick(['#ff3bd4', '#35f0ff', '#39ff14']));
          x += bw + (r() < .3 ? 8 : 0);
        }
      },
      near(g) {
        const r = rng(9); let x = 0;
        while (x < LW) {
          const bw = Math.min(snap(40 + r() * 50), LW - x), bh = snap(50 + r() * 70);
          R(g, x, GY - bh, bw, bh, '#12141b');
          if (r() < .7) { const c = pick(['#ff3bd4', '#35f0ff', '#ffe23f', '#39ff14']); R(g, x + 6, GY - bh + 8, bw - 12, 10, c); R(g, x + 8, GY - bh + 10, bw - 16, 6, '#12141b'); R(g, x + 10, GY - bh + 12, bw - 20, 2, c); }
          for (let wy = GY - bh + 26; wy < GY - 10; wy += 14) R(g, x + 6, wy, bw - 12, 6, r() < .5 ? '#3a3050' : '#ffe28a');
          x += bw + snap(20 + r() * 40);
        }
        for (let lx = 40; lx < LW; lx += 128) {
          disc(g, lx + 14, GY - 116, 26, 'rgba(255,226,138,0.12)');
          R(g, lx, GY - 120, 4, 120, '#4a4e5c'); R(g, lx, GY - 122, 18, 4, '#4a4e5c'); R(g, lx + 10, GY - 118, 10, 6, '#ffe28a');
        }
      },
      ground(g, w, h) {
        R(g, 0, 0, w, h, '#2c2d33'); R(g, 0, 0, w, 14, '#8d8f99'); R(g, 0, 0, w, 3, '#b8bac4'); R(g, 30, 3, 2, 11, '#6a6c76');
        R(g, 0, 14, w, 4, '#5a5c66'); R(g, 8, 72, 32, 5, '#f4f4f4'); R(g, 0, 150, w, 3, '#f4f4f4');
        const r = rng(3); for (let i = 0; i < 40; i++) R(g, snap(r() * w, 2), snap(20 + r() * (h - 20), 2), 2, 2, r() < .5 ? '#3a3b42' : '#232429');
      },
      cloud: '#4a4870', cursor: { k: '#000', g: '#3c3f47', h: '#b0b6c4', r: '#5a5e68' },
      rocket: { k: '#10131c', w: '#c9d1dc', g: '#4a9eff' }, flame: { r: '#1e6bff', y: '#9fd8ff' },
    },
    { // ---- 2. Village
      name: 'Vesnice', icon: '🏡',
      sky: ['#41a6f6', '#4fb3f3', '#5fc0ef', '#73cdea', '#8ad8e6', '#a6e2e2'],
      skyFx() {},
      far(g) {
        for (let x = 0; x < LW; x += 4) {
          const y = snap(GY - 150 - 40 * Math.sin(x / LW * Math.PI * 4) - 18 * Math.sin(x / LW * Math.PI * 10 + 1));
          R(g, x, y, 4, GY - y, '#8fcf6e');
          const y2 = snap(GY - 80 - 24 * Math.sin(x / LW * Math.PI * 6 + 2));
          R(g, x, y2, 4, GY - y2, '#6fb75a');
        }
        const r = rng(4); for (let i = 0; i < 14; i++) { const x = snap(r() * (LW - 20) + 10); const y = snap(GY - 90 - 24 * Math.sin(x / LW * Math.PI * 6 + 2)); disc(g, x, y, 10, '#4f9a4a'); }
      },
      near(g) {
        const house = (x, wall, roof, w, h) => {
          const top = GY - h;
          for (let i = 0; i < 28; i += 2) R(g, x - 4 + i, top - 28 + i, w + 8 - i * 2, 2, roof);
          R(g, x + w - 20, top - 36, 10, 22, '#7a3a2a'); R(g, x + w - 22, top - 38, 14, 4, '#5a2a1a');
          R(g, x, top, w, h, wall); R(g, x + 8, top + 10, 14, 14, '#ffe28a'); R(g, x + 14, top + 10, 2, 14, '#6b4226'); R(g, x + 8, top + 16, 14, 2, '#6b4226');
          R(g, x + w - 22, GY - 28, 14, 28, '#6b4226'); R(g, x + w - 12, GY - 16, 2, 2, '#ffe23f');
        };
        const tree = (x, s) => { R(g, x - 3, GY - 30 * s, 6, 30 * s, '#6b4226'); disc(g, x, GY - 42 * s, 18 * s, '#2f8a3a'); disc(g, x - 5, GY - 48 * s, 10 * s, '#4fb04a'); };
        house(30, '#f2e2b8', '#b13e53', 70, 56); tree(140, 1.2); house(190, '#e8d0a0', '#8b4a2b', 60, 48); tree(290, 1); tree(318, .8);
        house(360, '#f4ead0', '#3b5dc9', 80, 60); tree(476, 1.3);
        for (let x = 0; x < LW; x += 12) R(g, x, GY - 22, 4, 22, '#c8a26a');

  function itemSprite(map, pal) {
    const N = 12, grid = Array.from({ length: N }, () => Array(N).fill('.'));
    map.forEach((row, y) => { for (let x = 0; x < 10; x++) { const ch = row[x] || '.'; if (ch !== '.') grid[y + 1][x + 1] = ch; } });
    const out = grid.map(r => r.slice());
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (grid[y][x] !== '.') continue;
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const v = grid[y + dy] && grid[y + dy][x + dx]; return v && v !== '.'; })) out[y][x] = 'k';
    }
    return makeSprite(out.map(r => r.join('')), pal, 2);
  }
  const ITEMS = ITEM_DEFS.map((d, i) => {
    const rar = Math.floor(i / 10), r = RAR[rar], j = i % 10;
    const [name, shape, a, b, c, dd, e] = d;
    const pal = Object.assign({}, FIX, { a, b, c, d: dd || c, e: e || '#ff3b30' });
    const spr = itemSprite(SH[shape], pal);
    const locked = canvasOf(24, 24, g => { g.drawImage(spr, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#2a2d44'; g.fillRect(0, 0, 24, 24); });
    return { id: i, name, rar, value: Math.round(r.min + (r.max - r.min) * j / 9), spr, locked };
  });

  // ================= Token Market =================
  const MARKET = [
    { good: true, label: '+2× 10s', big: '+2×', fx: 'x2' },
    { good: true, label: '+10', big: '+10 TOKENŮ', fx: 'plus10' },
    { good: true, label: '+1× STREAK', big: '+1× STREAK', fx: 'streak' },
    { good: true, label: 'ŠTÍT 5s', big: 'ŠTÍT!', fx: 'shield' },
    { good: false, label: '-50% 5s', big: '-50%', fx: 'half' },
    { good: false, label: '-5', big: '-5 TOKENŮ', fx: 'minus5' },
    { good: false, label: 'RESET STREAK', big: 'RESET STREAK', fx: 'reset' },
    { good: false, label: '-1 ŽIVOT', big: '-1 ♥', fx: 'life' },
  ];

  // ================= State =================
  let state = 'menu'; // menu | play | over
  let p, obstacles, items, lines, particles, popups, bigFx, clouds;
  let speed, dist, distAcc, score, streak, streakAcc, maxStreak, lives, invuln, fx, runFound, runNew;
  let spawnT, itemT, lineT, frame = 0, shake = 0, lastT = 0, happyT = 0;
  let offSky = 0, offFar = 0, offNear = 0, offGround = 0;
  let themeCur = Math.floor(Math.random() * 5), themeNext = -1, fadeT = 0, themeT = 300;
  const FADE = 120;
  const input = { jump: false, duck: false, jumpQueued: false };

  clouds = Array.from({ length: 6 }, (_, i) => ({ x: i * 90 + Math.random() * 60, y: 40 + Math.random() * 260, s: 0.2 + Math.random() * 0.3 }));
  particles = []; popups = []; bigFx = null;

  function reset() {
    p = { y: GY - 32, vy: 0, onGround: true, duck: false, dead: false };
    obstacles = []; items = []; lines = []; particles = []; popups = []; bigFx = null;
    speed = 4.5; dist = 0; distAcc = 0; score = 0; streak = 1; streakAcc = 0; maxStreak = 1;
    lives = DIFFS[settings.diff].lives; invuln = 0; fx = { x2: 0, half: 0, shield: 0 };
    runFound = 0; runNew = 0; spawnT = 90; itemT = 140; lineT = 420; shake = 0; happyT = 0;
    themeT = (10 + Math.random() * 20) * 60;
  }
  reset();

  const activeTheme = () => THEMES[themeNext >= 0 ? themeNext : themeCur];

  // ================= Effects helpers =================
  function burst(x, y, n, cols, spd = 3, life = 30, grav = 0.15, size = 3) {
    for (let i = 0; i < n && particles.length < 350; i++) {
      const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random());
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.6), max: life, c: pick(cols), s: size, g: grav });
    }
  }
  function dust(x, y, n = 6) {
    for (let i = 0; i < n; i++) particles.push({ x: x + Math.random() * 20, y, vx: -1 - Math.random() * 2, vy: -Math.random() * 1.5, life: 20, max: 20, c: pick(['#d8d0c0', '#b0a898', '#ffffff']), s: 4, g: 0.05 });
  }
  function popup(text, x, y, color, size = 12) { popups.push({ text, x, y, color, size, t: 50 }); }
  function big(text, color) { bigFx = { text, color, t: 70 }; }

  function addTokens(base) {
    const mult = streak * (fx.x2 > 0 ? 2 : 1) * (fx.half > 0 ? 0.5 : 1);
    const gained = base * mult;
    score += gained;
    streakAcc += base;
    while (streakAcc >= 100) {
      streakAcc -= 100;
      if (streak < 5) { streak = Math.min(5, streak + 0.5); maxStreak = Math.max(maxStreak, streak); popup('STREAK ' + fmtS(streak) + '×', PX, GY - 70, streakColor(streak), 12); beep(660, .1, 'square'); beep(990, .12, 'square', .08); }
    }
    return gained;
  }
  const fmtS = s => (s % 1 ? s.toFixed(1) : String(s));
  const streakColor = s => s < 2 ? '#39d353' : s < 3 ? '#ffe23f' : s < 4 ? '#ff8c1a' : '#ff3b30';

  function loseLife(cause) {
    lives--; streak = 1; streakAcc = 0; shake = 12;
    burst(PX + 16, p.y + 16, 18, ['#ff3b30', '#ffcd75', '#ffffff'], 4, 30);
    beep(180, .2, 'sawtooth');
    if (lives <= 0) { gameOver(); return; }
    invuln = 100;
    popup('-1 ♥', PX, p.y - 20, '#ff3b30', 14);
  }

  function applyMarket(m) {
    big(m.big, m.good ? '#39d353' : '#ff3b30');
    if (m.good) { beep(700, .08, 'square'); beep(1050, .12, 'square', .08); } else { beep(300, .12, 'square'); beep(200, .18, 'square', .1); }
    switch (m.fx) {
      case 'x2': fx.x2 = 600; break;
      case 'plus10': addTokens(10); break;
      case 'streak': streak = Math.min(5, streak + 1); maxStreak = Math.max(maxStreak, streak); break;
      case 'shield': fx.shield = 300; break;
      case 'half': fx.half = 300; break;
      case 'minus5': score = Math.max(0, score - 5); break;
      case 'reset': streak = 1; streakAcc = 0; break;
      case 'life': loseLife(); break;
    }
  }

  function collect(it) {
    const def = ITEMS[it.id], r = RAR[def.rar];
    const g = addTokens(def.value);
    popup('+' + Math.round(g), it.x, it.y - 10, r.col, def.rar >= 4 ? 16 : 12);
    burst(it.x + 12, it.y + 12, 8 + def.rar * 4, [r.col, '#ffffff', '#ffe23f'], 2.5 + def.rar * 0.5, 26, 0.05, 2);
    happyT = 16; runFound++;
    beep(880 + def.rar * 120, .06, 'square'); beep(1320 + def.rar * 160, .08, 'square', .06);
    if (!found[it.id]) {
      found[it.id] = 1; runNew++; store.set('bnpk_coll', found);
      popup('NOVÝ!', it.x, it.y - 30, '#ffffff', 10);
    } else found[it.id]++;
    if (def.rar >= 4) big(def.name.toUpperCase(), r.col);
  }

  // ================= Spawning =================
  const aheadClear = (arrs, from) => arrs.every(a => a.every(o => o.x + (o.w || 24) < from));

  function spawnObstacle() {
    if (!aheadClear([lines], W - 40)) { spawnT = 12; return; }
    const sc = score, th = activeTheme();
    const grogChance = dist > 1500 ? Math.min(0.35, 0.15 + dist / 60000) : 0;
    if (Math.random() < grogChance) {
      const high = Math.random() < 0.3;
      obstacles.push({ type: 'grog', th, x: W + 20, y: high ? GY - 92 : GY - 50, w: 48, h: 24, vx: 1.2 });
    } else {
      const n = dist > 4000 && Math.random() < 0.35 ? (dist > 10000 && Math.random() < 0.4 ? 3 : 2) : 1;
      for (let i = 0; i < n; i++) obstacles.push({ type: 'cursor', th, x: W + 20 + i * 22, y: GY - 32, w: 24, h: 32, vx: 0 });
    }
    spawnT = (240 + 22 * speed + Math.random() * 260) / speed;
    void sc;
  }
  function rollRarity() {
    let r = Math.random() * 100;
    for (let i = 0; i < RAR.length; i++) { if ((r -= RAR[i].w) < 0) return i; }
    return 0;
  }
  function spawnItem() {
    itemT = 90 + Math.random() * 130;
    if (!aheadClear([lines], W - 20)) return;
    const rar = rollRarity(), id = rar * 10 + Math.floor(Math.random() * 10);
    const high = Math.random() < 0.5;
    items.push({ id, x: W + 20, y: high ? GY - 112 : GY - 30, w: 24, h: 24, ph: Math.random() * 6 });
  }
  function spawnLines() {
    lineT = 360 + Math.random() * 360;
    if (!aheadClear([obstacles, lines], W - 60)) { lineT = 30; return; }
    const AIR = GY - 104, GND = GY - 14;
    const mk = (m, x, y) => lines.push({ m, x, y, w: 84, h: 10, used: false });
    const pat = Math.random();
    if (pat < 0.35) mk(pick(MARKET), W + 20, GND);
    else if (pat < 0.7) mk(pick(MARKET), W + 20, AIR);
    else {
      const good = pick(MARKET.filter(m => m.good)), bad = pick(MARKET.filter(m => !m.good));
      const lowFirst = Math.random() < 0.5, goodFirst = Math.random() < 0.5;
      mk(goodFirst ? good : bad, W + 20, lowFirst ? GND : AIR);
      mk(goodFirst ? bad : good, W + 20 + 130, lowFirst ? AIR : GND);
    }
    spawnT = Math.max(spawnT, 60);
  }

  // ================= Update =================
  function hit(a, b, pad = 4) {
    return a.x + pad < b.x + b.w - pad && a.x + a.w - pad > b.x + pad && a.y + pad < b.y + b.h - pad && a.y + a.h - pad > b.y + pad;
  }
  function updateThemes(dt, menu) {
    if (themeNext >= 0) {
      fadeT += dt;
      if (fadeT >= FADE) { themeCur = themeNext; themeNext = -1; fadeT = 0; themeT = menu ? 300 : (10 + Math.random() * 20) * 60; }
    } else {
      themeT -= dt;
      if (themeT <= 0) { let n; do n = Math.floor(Math.random() * 5); while (n === themeCur); themeNext = n; fadeT = 0; }
    }
  }

  function update(dt) {
    frame += dt;
    updateThemes(dt, state === 'menu');
    const sp = state === 'play' ? speed : state === 'menu' ? 3 : 0;
    const mv = sp * dt;
    offSky += mv * 0.03; offFar += mv * 0.15; offNear += mv * 0.45; offGround += mv;
    clouds.forEach(c => { c.x -= (c.s + sp * 0.08) * dt; if (c.x < -70) { c.x = W + Math.random() * 60; c.y = 40 + Math.random() * 260; } });
    particles.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.life -= dt; });
    particles = particles.filter(q => q.life > 0);
    popups.forEach(q => { q.y -= 0.8 * dt; q.t -= dt; });
    popups = popups.filter(q => q.t > 0);
    if (bigFx && (bigFx.t -= dt) <= 0) bigFx = null;

    if (state === 'over') { if (p.dead) { p.vy += 0.5 * dt; p.y += p.vy * dt; } return; }
    if (state !== 'play') return;

    const D = DIFFS[settings.diff].mul;
    speed = Math.min(10, 4.5 + dist / 4000) * D;
    dist += mv; distAcc += mv;
    while (distAcc >= 100) { distAcc -= 100; addTokens(1); }
    for (const k in fx) if (fx[k] > 0) fx[k] = Math.max(0, fx[k] - dt);
    if (invuln > 0) invuln -= dt;
    if (happyT > 0) happyT -= dt;

    // Player physics
    const wasGround = p.onGround;
    if ((input.jump || input.jumpQueued) && p.onGround && !input.duck) {
      p.vy = -11.2; p.onGround = false; beep(520, 0.08, 'square'); dust(PX, GY - 2, 8);
    }
    input.jumpQueued = false;
    const g = input.duck && !p.onGround ? 1.6 : (input.jump && p.vy < 0 ? 0.5 : 0.8);
    p.vy += g * dt; p.y += p.vy * dt;
    const hNow = p.onGround && input.duck ? 20 : 32;
    if (p.y >= GY - hNow) { p.y = GY - hNow; p.vy = 0; p.onGround = true; if (!wasGround) dust(PX, GY - 2, 6); }
    p.duck = p.onGround && input.duck;
    if (p.duck) p.y = GY - 20;
    if (p.onGround && Math.random() < 0.08 * dt) dust(PX - 6, GY - 2, 1);

    // Spawning
    if ((spawnT -= dt) <= 0) spawnObstacle();
    if ((itemT -= dt) <= 0) spawnItem();
    if ((lineT -= dt) <= 0) spawnLines();

    const box = p.duck ? { x: PX - 4, y: p.y, w: 40, h: 20 } : { x: PX, y: p.y, w: 32, h: 32 };

    obstacles.forEach(o => {
      o.x -= (speed + o.vx) * dt;
      if (o.type === 'grog' && o.th.smoke && Math.random() < 0.3 * dt)
        particles.push({ x: o.x + 38, y: o.y - 8, vx: 1 + Math.random(), vy: -0.6 - Math.random() * 0.6, life: 40, max: 40, c: pick(['#1a1a1a', '#333', '#222']), s: 5, g: -0.01 });
    });
    obstacles = obstacles.filter(o => o.x > -70 && !o.gone);
    items.forEach(it => { it.x -= mv; });
    lines.forEach(l => { l.x -= mv; });

    items = items.filter(it => {
      if (hit(box, { x: it.x, y: it.y, w: 24, h: 24 }, 0)) { collect(it); return false; }
      return it.x > -30;
    });
    for (const l of lines) {
      if (!l.used && hit(box, l, 0)) {
        l.used = true;
        burst(PX + 16, l.y + 5, 20, l.m.good ? ['#39d353', '#a7f070', '#ffffff'] : ['#ff3b30', '#ff8a8a', '#000'], 3.5, 28, 0.05, 3);
        applyMarket(l.m);
        if (state !== 'play') return;
      }
    }
    lines = lines.filter(l => l.x > -100);

    if (invuln <= 0) for (const o of obstacles) {
      const ob = o.type === 'cursor' ? { x: o.x + 2, y: o.y, w: 16, h: 30 } : { x: o.x, y: o.y + 4, w: 44, h: 16 };
      if (hit(box, ob, 2)) {
        o.gone = true;
        burst(o.x + o.w / 2, o.y + o.h / 2, 14, ['#ffffff', '#aaaaaa', '#ffcd75'], 3.5, 26);
        if (fx.shield > 0) { fx.shield = 0; invuln = 50; big('ŠTÍT ZACHRÁNIL!', '#35d0ff'); beep(900, .1, 'triangle'); }
        else loseLife();
        break;
      }
    }
  }

  function gameOver() {
    state = 'over'; p.dead = true; p.vy = -9; shake = 18; streak = 1;
    burst(PX + 16, p.y + 16, 60, ['#ff3b30', '#ff8c1a', '#ffe23f', '#ffffff', '#4A9EFF'], 6, 50, 0.12, 4);
    beep(200, 0.25, 'sawtooth'); beep(110, 0.4, 'sawtooth', .15); beep(60, .5, 'square', .3);
    const s = Math.floor(score), isBest = s > best;
    if (isBest) { best = s; store.set('bnpk_best', best); }
    $('scoreOver').textContent = s; $('bestOver').textContent = best; $('bestMenu').textContent = best;
    $('newBest').classList.toggle('hidden', !isBest);
    $('runInfo').innerHTML = `Předměty: ${runFound} · Nové: ${runNew}<br>Max streak: ${fmtS(maxStreak)}×`;
    setTimeout(() => { if (state === 'over') $('over').classList.remove('hidden'); }, 900);
  }

  // ================= Draw =================
  function tiled(img, off, y) {
    const w = img.width; let x = -(((off % w) + w) % w);
    for (; x < W; x += w) ctx.drawImage(img, Math.round(x), y);
  }
  function text(s, x, y, size, color, align = 'left', base = 'top') {
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base;
    ctx.fillStyle = '#000'; ctx.fillText(s, x + 2, y + 2);
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  function drawTheme(t) {
    tiled(t.skyC, offSky, 0);
    if (t.cloudC) clouds.forEach(c => ctx.drawImage(t.cloudC, Math.round(c.x), Math.round(c.y)));
    if (t === THEMES[3]) { // twinkle
      for (let i = 0; i < 12; i++) if ((Math.floor(frame / 10) + i * 7) % 5 === 0) R(ctx, (i * 97 + 31) % W, (i * 53 + 17) % 400, 2, 2, '#ffffff');
    }
    tiled(t.farC, offFar, 0);
    tiled(t.nearC, offNear, 0);
    tiled(t.groundC, offGround, GY);
  }

  function drawObstacle(o) {
    const t = o.th;
    if (o.type === 'cursor') { ctx.drawImage(t.cursorC, Math.round(o.x) - t.cursorOff, o.y - t.cursorOff); return; }
    const x = Math.round(o.x), f = Math.floor(frame / 4) % 2;
    if (t.ufo) {
      ctx.fillStyle = 'rgba(57,255,20,0.12)'; ctx.fillRect(x + 8, o.y + 22, 32, 10);
      ctx.drawImage(t.rocketC[f], x, o.y); return;
    }
    if (t.smoke) ctx.drawImage(chimney, x + 34, o.y - 6);
    const fl = t.flameC[f];
    ctx.drawImage(fl, x + 48, o.y + 12 - fl.height / 2);
    ctx.drawImage(t.rocketC[0], x, o.y);
  }

  function drawLine(l) {
    if (l.used) return;
    const good = l.m.good, x = Math.round(l.x);
    const blink = !good && Math.floor(frame / 6) % 2;
    const main = good ? '#39d353' : (blink ? '#ff3b30' : '#b01818'), light = good ? '#c8ffb0' : '#ffb0b0';
    const glow = 0.18 + 0.1 * Math.sin(frame / 6);
    ctx.fillStyle = good ? `rgba(57,211,83,${glow})` : `rgba(255,59,48,${glow})`;
    ctx.fillRect(x - 6, l.y - 6, l.w + 12, l.h + 12);
    R(ctx, x, l.y, l.w, l.h, main); R(ctx, x, l.y + 3, l.w, 3, light);
    R(ctx, x - 4, l.y - 5, 20, 20, '#000'); R(ctx, x - 2, l.y - 3, 16, 16, main);
    R(ctx, x + 1, l.y + 4, 10, 2, '#fff'); if (good) R(ctx, x + 5, l.y, 2, 10, '#fff');
    text(l.m.label, x + l.w / 2 + 6, l.y - 16, 8, good ? '#a7f070' : '#ff8a8a', 'center');
  }

  function drawPlayer() {
    if (state === 'menu') { ctx.drawImage(Math.floor(frame / 6) % 2 ? klodRun1 : klodRun2, PX, GY - 32); return; }
    if (invuln > 0 && Math.floor(frame / 4) % 2 && !p.dead) return;
    let spr;
    if (p.dead) spr = klodDead;
    else if (p.duck) spr = Math.floor(frame / 5) % 2 ? klodDuck1 : klodDuck2;
    else if (happyT > 0) spr = klodHappy;
    else if (!p.onGround) spr = klodJump;
    else spr = Math.floor(frame / 5) % 2 ? klodRun1 : klodRun2;
    ctx.drawImage(spr, p.duck ? PX - 4 : PX, Math.round(p.y));
    if (fx.shield > 0 && !p.dead) {
      ctx.strokeStyle = `rgba(53,208,255,${0.5 + 0.3 * Math.sin(frame / 4)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(PX + 16, p.y + (p.duck ? 10 : 16), 26, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawHUD() {
    // Streak (top-left)
    const sc = streakColor(streak);
    if (!(streak >= 4 && Math.floor(frame / 8) % 2)) text('Streak: ' + fmtS(streak) + '×', 12, 14, 12, sc);
    const sw = 120; R(ctx, 12, 34, sw, 6, '#000'); R(ctx, 14, 36, (sw - 4) * (streak >= 5 ? 1 : streakAcc / 100), 2, sc);
    // Lives
    const maxL = DIFFS[settings.diff].lives;
    for (let i = 0; i < maxL; i++) ctx.drawImage(i < lives ? heartSpr : heartEmpty, 12 + i * 18, 48);
    // Score (top-right)
    const cs = ITEMS[10].spr;
    ctx.drawImage(cs, W - 34, 10);
    text(String(Math.floor(score)).padStart(6, '0'), W - 40, 16, 14, '#ffcd75', 'right');
    if (best > 0) text('HI ' + String(best).padStart(6, '0'), W - 40, 36, 8, '#f4f4f4', 'right');
    // Timers (top-right)
    let ty = 54;
    const tm = (k, lab, col, max) => {
      if (fx[k] <= 0) return;
      R(ctx, W - 112, ty, 100, 20, 'rgba(0,0,0,0.6)');
      R(ctx, W - 110, ty + 16, 96 * fx[k] / max, 2, col);
      text(lab + ' ' + Math.ceil(fx[k] / 60) + 's', W - 106, ty + 4, 8, col);
      ty += 24;
    };
    tm('x2', '+2×', '#39d353', 600); tm('half', '-50%', '#ff3b30', 300); tm('shield', 'ŠTÍT', '#35d0ff', 300);
  }

  function drawThemeBadge() {
    const t = activeTheme();
    R(ctx, 8, H - 44, 36, 36, 'rgba(0,0,0,0.55)');
    ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.icon, 26, H - 25);
  }

  function draw() {
    ctx.save();
    if (shake > 0) { ctx.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake)); shake *= 0.86; if (shake < 0.5) shake = 0; }
    drawTheme(THEMES[themeCur]);
    if (themeNext >= 0) { ctx.globalAlpha = Math.min(1, fadeT / FADE); drawTheme(THEMES[themeNext]); ctx.globalAlpha = 1; }

    if (state !== 'menu') {
      lines.forEach(drawLine);
      items.forEach(it => {
        const def = ITEMS[it.id], by = Math.round(it.y + Math.sin(frame / 8 + it.ph) * 3);
        if (def.rar >= 3) {
          ctx.fillStyle = RAR[def.rar].col; ctx.globalAlpha = 0.25 + 0.15 * Math.sin(frame / 5);
          ctx.fillRect(Math.round(it.x) - 4, by - 4, 32, 32); ctx.globalAlpha = 1;
        }
        ctx.drawImage(def.spr, Math.round(it.x), by);
        if (def.rar === 5 && Math.random() < 0.3) particles.push({ x: it.x + Math.random() * 24, y: by + Math.random() * 24, vx: 0, vy: -0.5, life: 16, max: 16, c: pick(['#ff3b30', '#ffe23f', '#39d353', '#3b8bff', '#a64dff']), s: 2, g: 0 });
      });
      obstacles.forEach(drawObstacle);
    }
    drawPlayer();

    particles.forEach(q => { ctx.globalAlpha = Math.max(0, q.life / q.max); R(ctx, q.x, q.y, q.s, q.s, q.c); });
    ctx.globalAlpha = 1;
    popups.forEach(q => { ctx.globalAlpha = Math.min(1, q.t / 20); text(q.text, q.x, q.y, q.size, q.color, 'left'); });
    ctx.globalAlpha = 1;

    if (state === 'play' || state === 'over') {
      drawHUD();
      if (bigFx) {
        const k = bigFx.t / 70, sz = Math.round(18 + 14 * Math.min(1, (1 - k) * 4));
        ctx.globalAlpha = Math.min(1, k * 3);
        text(bigFx.text, W / 2, 300, Math.min(sz, Math.floor((W - 20) / Math.max(4, bigFx.text.length))), bigFx.color, 'center', 'middle');
        ctx.globalAlpha = 1;
      }
    }
    drawThemeBadge();
    ctx.restore();
  }

  // ================= Loop =================
  function loop(t) {
    const dt = lastT ? Math.min(3, (t - lastT) / (1000 / 60)) : 1;
    lastT = t;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  // ================= Sound =================
  let actx = null;
  function beep(freq, dur, type, delay = 0) {
    if (!settings.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  // ================= UI flow =================
  const panels = ['menu', 'coll', 'sett', 'over'];
  const show = id => panels.forEach(x => $(x).classList.toggle('hidden', x !== id));

  function start() {
    reset(); state = 'play'; show(null);
    input.jump = input.duck = input.jumpQueued = false;
  }
  function toMenu() { state = 'menu'; reset(); refreshMenu(); show('menu'); }
  function refreshMenu() {
    const n = Object.keys(found).length;
    $('bestMenu').textContent = best;
    $('collCount').textContent = `Sbírka: ${n} / 50`;
    $('collCount2').textContent = `Nalezeno ${n} / 50`;
    $('sndBtn').textContent = settings.sound ? '🔊 ZAP' : '🔇 VYP';
    $('diffBtn').textContent = DIFFS[settings.diff].name;
    $('diffInfo').textContent = DIFFS[settings.diff].info;
  }
  function buildCollection() {
    const grid = $('grid'); grid.innerHTML = '';
    RAR.forEach((r, ri) => {
      const h = document.createElement('h3'); h.textContent = `${r.cz} (${r.w}%)`; h.style.color = r.col; grid.appendChild(h);
      const row = document.createElement('div'); row.className = 'row';
      ITEMS.filter(it => it.rar === ri).forEach(it => {
        const has = !!found[it.id];
        const s = document.createElement('div'); s.className = 'slot';
        if (has) s.style.borderColor = r.col;
        const c = document.createElement('canvas'); c.width = 24; c.height = 24;
        c.getContext('2d').drawImage(has ? it.spr : it.locked, 0, 0);
        s.appendChild(c);
        s.addEventListener('click', () => {
          $('info').innerHTML = has
            ? `<span style="color:${r.col}">${it.name}</span><br>${r.name} · ${it.value} tokenů · ${found[it.id]}×`
            : `<span style="color:#5a5e7a">??? zamčeno</span><br>${r.name}`;
        });
        row.appendChild(s);
      });
      grid.appendChild(row);
    });
    $('info').textContent = 'Klepni na předmět';
  }

  $('playBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('menuBtn').addEventListener('click', toMenu);
  $('collBtn').addEventListener('click', () => { buildCollection(); refreshMenu(); show('coll'); });
  $('setBtn').addEventListener('click', () => { refreshMenu(); show('sett'); });
  $('collBack').addEventListener('click', () => show('menu'));
  $('setBack').addEventListener('click', () => show('menu'));
  $('sndBtn').addEventListener('click', () => { settings.sound = !settings.sound; store.set('bnpk_set', settings); refreshMenu(); beep(660, .08, 'square'); });
  $('diffBtn').addEventListener('click', () => { settings.diff = (settings.diff + 1) % 3; store.set('bnpk_set', settings); refreshMenu(); });
  refreshMenu();

  // Keyboard
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'], DUCK_KEYS = ['ArrowDown', 'KeyS'];
  const menuOpen = () => state === 'menu' && !$('menu').classList.contains('hidden');
  const overOpen = () => state === 'over' && !$('over').classList.contains('hidden');
  window.addEventListener('keydown', e => {
    if (JUMP_KEYS.includes(e.code)) {
      e.preventDefault();
      if (state !== 'play') { if (!e.repeat && (menuOpen() || overOpen())) start(); return; }
      if (!input.jump) input.jumpQueued = true;
      input.jump = true;
    } else if (DUCK_KEYS.includes(e.code)) { e.preventDefault(); input.duck = true; }
    else if (e.code === 'Enter' && (menuOpen() || overOpen())) { e.preventDefault(); start(); }
    else if (e.code === 'Escape' && state === 'menu') show('menu');
  });
  window.addEventListener('keyup', e => {
    if (JUMP_KEYS.includes(e.code)) input.jump = false;
    else if (DUCK_KEYS.includes(e.code)) input.duck = false;
  });

  // Touch buttons
  function bindHold(el, key) {
    const on = e => { e.preventDefault(); if (state === 'play') { if (key === 'jump' && !input.jump) input.jumpQueued = true; input[key] = true; } el.classList.add('on'); };
    const off = e => { e.preventDefault(); input[key] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, off));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold($('btnJump'), 'jump');
  bindHold($('btnDuck'), 'duck');
  cv.addEventListener('pointerdown', e => { if (state === 'play') { e.preventDefault(); input.jumpQueued = true; } });

  try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {}); } catch (e) {}
  document.addEventListener('visibilitychange', () => { lastT = 0; input.jump = input.duck = false; });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();
  requestAnimationFrame(loop);

  // Debug/test hook
  window.__bnpk = { get state() { return state; }, get score() { return score; }, start, ITEMS, THEMES, setTheme(i) { themeNext = i; fadeT = FADE - 1; } };
})();
</script>
</body>
